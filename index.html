    <!-- Service workers disabled: stale cached bundles were blocking production rendering. -->
    <!-- 🛡️ SILENT TELEMETRY INTERCEPTOR — Previene bloqueo por 400/403 en /__l5e/trackevents -->
    <script>
      (function () {
        const ORIGIN = window.location.origin;
        const TELEMETRY_PATH = '/__l5e/trackevents';
        const originalFetch = window.fetch.bind(window);
        const originalSendBeacon = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);

        const normalizeUrl = (input) => {
          if (typeof input === 'string') return input;
          if (input && typeof input === 'object' && 'url' in input) return input.url;
          return String(input);
        };

        const isTelemetryUrl = (url) => {
          const normalized = normalizeUrl(url);
          return normalized === ORIGIN + TELEMETRY_PATH || normalized.endsWith(TELEMETRY_PATH);
        };

        const ensureValidBody = (data) => {
          // Si ya es string válido, devolverlo tal cual
          if (typeof data === 'string') {
            return data;
          }
          
          // Si es Blob, decodificar
          if (data instanceof Blob) {
            try {
              return new TextDecoder().decode(data);
            } catch (_err) {
              return undefined;
            }
          }
          
          // Si es objeto, serializar a JSON
          if (typeof data === 'object' && data !== null) {
            try {
              return JSON.stringify(data);
            } catch (_err) {
              return undefined;
            }
          }
          
          // Cualquier otro tipo (null, undefined, etc.) devolverlo como está
          return data;
        };

        const safeTelemetryFetch = async (url, body) => {
          try {
            const validBody = ensureValidBody(body);
            const response = await originalFetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: validBody,
              keepalive: true,
            });
            
            if (!response.ok) {
              return;
            }
          } catch (_err) {
            // Silenciar completamente
          }
        };

        if (originalSendBeacon) {
          navigator.sendBeacon = function (url, data) {
            if (isTelemetryUrl(url)) {
              safeTelemetryFetch(url, data);
              return true;
            }
            return originalSendBeacon(url, data);
          };
        }

        window.fetch = async function (input, init) {
          const url = normalizeUrl(input);
          const isTelemetry = isTelemetryUrl(url);

          if (!isTelemetry) {
            return originalFetch(input, init);
          }

          try {
            const fetchOptions = { ...init, keepalive: true };
            
            // Si hay body, asegurarse de que es válido
            if (init && init.body !== undefined && init.body !== null) {
              fetchOptions.body = ensureValidBody(init.body);
            }
            
            const response = await originalFetch(url, fetchOptions);
            
            if (!response.ok) {
              return new Response(JSON.stringify({}), {
                status: 200,
                headers: { 'Content-Type': 'application/json' },
              });
            }
            return response;
          } catch (_err) {
            return new Response(JSON.stringify({}), {
              status: 200,
              headers: { 'Content-Type': 'application/json' },
            });
          }
        };
      })();
    </script>
